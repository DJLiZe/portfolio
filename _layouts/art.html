---
layout: default
---
<!--
  art.html - the page for one art piece. Jekyll uses it for every file in
  _art/, filling in the blanks from that file's front matter (the lines
  between the two "---" at its top).
-->
    <h2>{{ page.title }}</h2>
    <p class="date">{{ page.date | date: "%B %Y" }}</p>

    <!-- The small web copy made by resize-image.sh. The original stays in source/art/. -->
    <img class="artwork" src="{{ page.image | relative_url }}" alt="{{ page.alt | escape }}">

    <p>{{ page.description }}</p>
{{ content }}
