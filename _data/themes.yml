# themes.yml - the color themes you can pick with "color_theme:" in _config.yml.
#
# Each theme is a name followed by six colors:
#   background - the page
#   text       - the main text
#   muted      - dates, captions, and other quieter text
#   accent     - links and highlights
#   card       - the boxes on the home page
#   border     - lines around cards and under headings
#
# To make your own theme, copy one block (the name line and the six lines
# under it), give it a new name, change the colors, and put that name in
# _config.yml. Keep the two spaces at the start of each color line.

default:
  background: "#fdfbf7"
  text: "#222222"
  muted: "#666666"
  accent: "#b5482a"
  card: "#ffffff"
  border: "#e4ded4"

