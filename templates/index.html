<!DOCTYPE html>
<!--
  index.html - the home page of your portfolio.

  This is a TEMPLATE. build-site.py replaces every word that starts with a
  dollar sign with the matching value from content.yaml (or with the cards it
  made), then saves the finished page as docs/index.html. Change the HTML
  around those words to change how the home page is laid out.
  (Need a real dollar sign in a template? Type two of them.)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$name - Portfolio</title>
  <!-- One stylesheet controls how every page looks. -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1><a href="index.html">$name</a></h1>
    <p class="tagline">$tagline</p>
  </header>

  <main>
    <h2>Art</h2>
    <div class="grid">
$art_cards
    </div>

    <h2>Writing</h2>
    <div class="grid">
$writing_cards
    </div>
  </main>

  <footer>
    <p>&copy; $year $name &middot; Made with plain HTML and CSS, published with GitHub Pages.</p>
  </footer>
</body>
</html>
