# publish.yml - builds your website and puts it on GitHub Pages.
#
# GitHub runs this for you every time you push to main. You can also run it
# by hand: on GitHub, open the Actions tab, click "Publish site" on the left,
# then click "Run workflow". Watch it there: a green check means your site is
# updated, a red X means something went wrong (click it to read why).

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# What this workflow is allowed to do: read your repo, and publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, finish one publish before starting the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A Mac, so build-site.py can use resize-image.sh exactly as you would on
    # your own Mac (it needs "sips", which only macOS has).
    runs-on: macos-latest
    steps:
      - name: Get the files from your repo
        uses: actions/checkout@v5

      - name: Get ready for GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the site into docs/
        run: python3 build-site.py

      - name: Package docs/ for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    # Runs after "build" finishes. Publishing doesn't need a Mac.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
