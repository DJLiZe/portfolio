# _data/art.yml - every art piece on your site, in one list.
#
# Each piece starts with "- title:" and the lines under it (indented by two
# spaces, lined up with "title") are that piece's details. To add a piece,
# copy one of them, paste it at the bottom, and change the values. The home
# page sorts them newest first, so the order here doesn't matter.
#
#   title:        the piece's name
#   date:         when you made it, written year-month-day (optional: leave
#                 the line out and no date is shown)
#   category:     which section of the home page it goes in (leave the line
#                 out and the piece goes in a section called "Other")
#   description:  one sentence about it
#   image:        the web copy that resize-image.sh made, in assets/img/
#   alt:          a short description of the picture, for people who can't
#                 see it
#
# If a value has a colon and a space in it (like "Part 1: Home"), wrap the
# whole value in "double quotes".

- title: Bluebonnets
  category: School Projects
  description: Stained-glass mosaic of Texas bluebonnets on a tiled background.
  image: /assets/img/bluebonnet.jpg
  alt: Mosaic artwork of bluebonnet flowers made from pieces of blue, black, and dark green glass tile, set against a grid of grey and sage-green background tiles.

- title: Bold Block Letters
  category: Cards
  description: A set of hand-lettered Thank You cards with bold, dimensional block letters.
  image: /assets/img/geo.jpg
  alt: A fan of six handmade greeting cards on a red background, each with the word THANK or THANK YOU drawn in a 3D bubble-block lettering style in different color schemes - green, teal, purple, navy, red, and the front card in purple and orange with doodled circles.

- title: Tulips
  category: Cards
  description: Colored-pencil tulips with hand-lettered Thank You.
  image: /assets/img/tulip.jpg
  alt: A greeting card with two orange-and-pink tulips and a bud drawn in colored pencil and watercolor, with "Thank You" written in black script across the stems.

- title: Thank You, Swirled
  category: Cards
  description: Watercolor "Thank You" framed by flowing calligraphy swirls.
  image: /assets/img/ty-swirl.jpg
  alt: Teal watercolor lettering reading "Thank You!" surrounded by an elaborate ring of decorative calligraphy flourishes and loops on white paper.

- title: Forget-Me-Not Thank You
  category: Cards
  description: A Thank You card bordered in watercolor forget-me-nots.
  image: /assets/img/ty-flowers.jpg
  alt: A Thank You card with blue, shimmering script lettering and a decorative capital J, bordered by small blue and purple watercolor forget-me-not flowers along the bottom and right edge.

- title: Wedding Card
  category: Cards
  description: Gold hand-lettered calligraphy for a wedding gift.
  image: /assets/img/page-and-tyler.jpg
  alt: Elegant gold calligraphy reading "Page & Tyler" with an ampersand, written in flowing flourished script on white paper.

- title: Darcy's Sign
  category: Metalwork
  description: A hand-forged wrought iron wall bracket with scrollwork hooks, painted with a name in gold and blue.
  image: /assets/img/darcy-sign-bracket.jpg
  alt: A black wrought iron wall-mounted sign bracket with curled scrollwork and several separate forged S-hooks, laid out on a workbench with the name "Darcy" hand-painted beside it in blue and gold lettering.

- title: Wire Heart
