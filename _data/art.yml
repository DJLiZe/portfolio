  image: /assets/img/barbara-jordan-portrait.jpg
  alt: A black-and-white painted portrait of Barbara Jordan, mid-speech with one finger raised, wearing a leopard-print blouse, painted over a background of her handwritten 1976 Democratic National Convention keynote speech with her name lettered across the top.

- title: Bird & Blossom
