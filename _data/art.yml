# _data/art.yml - every art piece on your site, in one list.
#
# Each piece starts with "- title:" and the lines under it (indented by two
# spaces, lined up with "title") are that piece's details. To add a piece,
# copy one of them, paste it at the bottom, and change the values. The home
# page sorts them newest first, so the order here doesn't matter.
#
#   title:        the piece's name
#   date:         when you made it, written year-month-day (optional: leave
#                 the line out and no date is shown)
#   category:     which section of the home page it goes in (leave the line
#                 out and the piece goes in a section called "Other")
#   description:  one sentence about it
#   image:        the web copy that resize-image.sh made, in assets/img/
#   alt:          a short description of the picture, for people who can't
#                 see it
#
# If a value has a colon and a space in it (like "Part 1: Home"), wrap the
# whole value in "double quotes".

