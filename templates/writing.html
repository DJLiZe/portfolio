<!DOCTYPE html>
<!--
  writing.html - the TEMPLATE for one piece of writing's page.
  build-site.py makes one page from this for every writing piece in
  content.yaml. The writing itself is read from its file in source/writing/.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title - $name</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1><a href="index.html">$name</a></h1>
    <p class="tagline"><a href="index.html">&larr; Back to all work</a></p>
  </header>

  <main class="prose">
    <h2>$title</h2>
    <p class="date">$date</p>

$text
  </main>

  <footer>
    <p>&copy; $year $name</p>
  </footer>
</body>
</html>
